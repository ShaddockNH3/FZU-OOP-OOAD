<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>篮球比赛可视化系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-y: scroll; /* html也要允许滚动 */
            height: auto;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            overflow-y: scroll; /* 强制显示滚动条 */
            overflow-x: hidden; /* 隐藏横向滚动 */
            height: auto;
        }

        #app {
            width: 100vw;
            /* 移除min-height限制 */
            display: flex;
            flex-direction: column;
            padding-bottom: 100px; /* 底部留白,确保可以滚动 */
        }

        /* 顶部状态栏 */
        .header {
            height: 80px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            border-bottom: 3px solid #ffd700;
            position: sticky; /* 固定在顶部 */
            top: 0;
            z-index: 100;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .team-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .home-team .team-logo {
            color: #552583;
        }

        .away-team .team-logo {
            color: #0c2340;
        }

        .team-name {
            font-size: 20px;
            font-weight: bold;
        }

        .score-board {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
            justify-content: center;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            color: #ffd700;
            white-space: nowrap; /* 防止换行 */
            min-width: 180px; /* 确保足够宽度 */
            text-align: center;
        }

        .quarter {
            font-size: 24px;
            background: rgba(255, 215, 0, 0.2);
            padding: 6px 20px;
            border-radius: 8px;
            border: 2px solid #ffd700;
            margin-right: 20px;
            color: #ffd700;
            font-weight: bold;
            white-space: nowrap; /* 强制横向显示 */
        }

        .time {
            font-size: 24px;
            background: rgba(255, 215, 0, 0.2);
            padding: 6px 20px;
            border-radius: 8px;
            border: 2px solid #ffd700;
            margin-left: 20px;
            color: #ffd700;
            font-weight: bold;
            white-space: nowrap; /* 强制横向显示 */
        }

        .away-team {
            flex: 1;
            justify-content: flex-end;
        }

        /* 主内容区 */
        .main-content {
            display: flex;
            gap: 20px;
            padding: 20px;
            padding-bottom: 200px; /* 给底部控件留出更多空间 */
            min-height: calc(100vh + 400px); /* 强制超出屏幕高度 */
        }

        /* 左侧动画区 */
        .animation-area {
            flex: 2;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            height: 600px; /* 固定高度 */
        }

        .event-display {
            position: absolute;
            top: -10px; /* 向上移到动画区域外 */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95); /* 更不透明 */
            padding: 15px 30px;
            border-radius: 10px;
            border: 3px solid #ffd700; /* 更粗的边框 */
            min-width: 400px; /* 更宽 */
            text-align: center;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.5); /* 添加阴影 */
        }

        .event-text {
            color: #ffd700;
            font-size: 20px; /* 更大 */
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            line-height: 1.4;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        #game-canvas {
            width: 100%;
            height: 100%;
        }

        /* 右侧统计区 */
        .stats-area {
            flex: 1;
            min-width: 0; /* 允许flex收缩 */
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-right: 10px;
            /* 移除overflow,让它跟随页面滚动 */
            min-height: 1200px; /* 强制最小高度,确保可以滚动 */
        }

        .stats-section {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 20px;
            flex-shrink: 0; /* 防止被压缩 */
        }

        .stats-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffd700;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 10px;
        }

        .team-stats {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            align-items: center;
        }

        .stat-row {
            display: contents;
        }

        .stat-label {
            text-align: center;
            font-weight: bold;
            color: #ffd700;
        }

        .stat-value-home {
            text-align: right;
            color: #ff6b6b;
        }

        .stat-value-away {
            text-align: left;
            color: #4ecdc4;
        }

        .player-stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .player-stats-table th {
            background: rgba(255, 215, 0, 0.2);
            padding: 8px 4px;
            text-align: center;
            font-size: 11px;
            border-bottom: 2px solid #ffd700;
        }

        .player-stats-table td {
            padding: 6px 4px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-stats-table tr:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        /* 控制面板 */
        .controls {
            position: relative; /* 改为相对定位 */
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            flex-wrap: wrap; /* 允许换行 */
            justify-content: center;
        }

        .progress-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
        }

        .progress-info {
            color: #ffd700;
            font-size: 14px;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #ffd700;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .progress-bar::-webkit-slider-thumb:hover {
            background: #ffed4e;
            transform: scale(1.2);
        }

        .progress-bar::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #ffd700;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .control-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #ffd700;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: #ffed4e;
            transform: scale(1.05);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .speed-control {
            display: flex;
            gap: 5px;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 12px; /* 更宽的滚动条 */
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 6px;
            border: 2px solid rgba(0, 0, 0, 0.5); /* 添加边框 */
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ffed4e; /* 悬停时变亮 */
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 顶部状态栏 -->
        <div class="header">
            <div class="team-info home-team">
                <div class="team-logo">LAL</div>
                <div class="team-name" id="home-team-name">洛杉矶湖人</div>
            </div>
            <div class="score-board">
                <div class="quarter" id="game-quarter">第1节</div>
                <div class="score" id="score">0 - 0</div>
                <div class="time" id="game-time">12:00</div>
            </div>
            <div class="team-info away-team">
                <div class="team-name" id="away-team-name">明尼苏达森林狼</div>
                <div class="team-logo">MIN</div>
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 左侧动画区 -->
            <div class="animation-area">
                <div id="game-canvas"></div>
                
                <!-- 实时事件显示 -->
                <div class="event-display">
                    <div class="event-text" id="event-text">等待比赛开始...</div>
                </div>
                
                <!-- 进度条 -->
                <div class="progress-container">
                    <div class="progress-info">
                        <span id="current-event">0</span> / <span id="total-events">0</span> 事件
                    </div>
                    <input type="range" id="progress-bar" min="0" max="100" value="0" class="progress-bar">
                </div>
            </div>

            <!-- 右侧统计区 -->
            <div class="stats-area">
                <!-- 控制面板 -->
                <div class="controls">
                    <button class="control-btn" id="prev-btn">上一步</button>
                    <button class="control-btn" id="play-btn">播放</button>
                    <button class="control-btn" id="pause-btn">暂停</button>
                    <button class="control-btn" id="next-btn">下一步</button>
                    <button class="control-btn" id="reset-btn">重置</button>
                    <div class="speed-control">
                        <button class="control-btn" id="speed-0.5">0.5x</button>
                        <button class="control-btn" id="speed-1">1x</button>
                        <button class="control-btn" id="speed-2">2x</button>
                        <button class="control-btn" id="speed-4">4x</button>
                    </div>
                    <input type="file" id="file-input" accept=".xlsx" style="display: none;">
                    <button class="control-btn" id="load-match1">比赛1</button>
                    <button class="control-btn" id="load-match2">比赛2</button>
                    <button class="control-btn" id="load-custom">自定义</button>
                </div>
                
                <!-- 球队技术统计 -->
                <div class="stats-section">
                    <div class="stats-title">球队技术统计</div>
                    <div class="team-stats" id="team-stats">
                        <!-- 动态生成 -->
                    </div>
                </div>

                <!-- 主队球员统计 -->
                <div class="stats-section">
                    <div class="stats-title" id="home-players-title">洛杉矶湖人 球员统计</div>
                    <table class="player-stats-table">
                        <thead>
                            <tr>
                                <th>号</th>
                                <th>球员</th>
                                <th>得分</th>
                                <th>投篮</th>
                                <th>三分</th>
                                <th>罚球</th>
                                <th>篮板</th>
                                <th>助攻</th>
                            </tr>
                        </thead>
                        <tbody id="home-players-stats">
                            <!-- 动态生成 -->
                        </tbody>
                    </table>
                </div>

                <!-- 客队球员统计 -->
                <div class="stats-section">
                    <div class="stats-title" id="away-players-title">明尼苏达森林狼 球员统计</div>
                    <table class="player-stats-table">
                        <thead>
                            <tr>
                                <th>号</th>
                                <th>球员</th>
                                <th>得分</th>
                                <th>投篮</th>
                                <th>三分</th>
                                <th>罚球</th>
                                <th>篮板</th>
                                <th>助攻</th>
                            </tr>
                        </thead>
                        <tbody id="away-players-stats">
                            <!-- 动态生成 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
