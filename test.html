<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>测试XLSX加载</title>
</head>
<body>
  <h1>测试XLSX文件加载</h1>
  <div id="result"></div>
  
  <script type="module">
    const result = document.getElementById('result');
    
    async function testLoad() {
      try {
        result.innerHTML = '<p>正在加载 match.xlsx...</p>';
        
        const response = await fetch('/match.xlsx');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const blob = await response.blob();
        result.innerHTML += `<p>✅ 文件加载成功! 大小: ${blob.size} bytes</p>`;
        
        // 尝试解析
        const XLSX = await import('https://cdn.sheetjs.com/xlsx-latest/package/xlsx.mjs');
        const arrayBuffer = await blob.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer);
        
        result.innerHTML += `<p>✅ 工作簿解析成功!</p>`;
        result.innerHTML += `<p>工作表列表: ${Object.keys(workbook.Sheets).join(', ')}</p>`;
        
        // 检查每个工作表
        for (let i = 1; i <= 4; i++) {
          const sheetName = `c${i}`;
          if (workbook.Sheets[sheetName]) {
            const sheet = workbook.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            result.innerHTML += `<p>✅ ${sheetName}: ${rows.length} 行</p>`;
          } else {
            result.innerHTML += `<p>❌ ${sheetName}: 未找到</p>`;
          }
        }
        
      } catch (error) {
        result.innerHTML += `<p style="color: red">❌ 错误: ${error.message}</p>`;
        console.error(error);
      }
    }
    
    testLoad();
  </script>
</body>
</html>
